      const [x1,y1] = route[i-1];
      const [x2,y2] = route[i];
      const peaks = Math.ceil(Math.hypot(x2-x1,y2-y1)/8);
      for (let j = 0; j < peaks; j++) {
        const t = j/peaks;
        const x = Math.round(x1+(x2-x1)*t+(random()-.5)*spread);
        const y = Math.round(y1+(y2-y1)*t+(random()-.5)*spread);
        const h = 7+Math.round(random()*19);
        const w = 5+Math.round(random()*9);
        svgNode('path',{d:'M'+(x-w)+' '+(y+4)+'L'+x+' '+(y-h)+' '+(x+w)+' '+(y+5)+'Z',
          fill:'#657457','fill-opacity':.82,stroke:'#4e6048','stroke-width':.7},features);
        svgNode('path',{d:'M'+x+' '+(y-h)+'l-3 '+(h+2)+' '+(-w+3)+' 2Z',
          fill:'#e1d9b4','fill-opacity':.77},features);
      }
    }
    const [x,y] = route[Math.floor((route.length-1)/2)];
    caption(name,x-23,y-spread*.65-12,'#46543e',13);
  }
  svgNode('path',{d:'M753 542q12-15 19-7t-6 22q-12 6-13-15Z M955 557q22 2 20 15l-12 13-5-18Z',
    fill:'#55929c',stroke:'#d1d5ab','stroke-width':2},features);
  for (const [name,path,x,y,width] of rivers) {
    svgNode('path',{d:path,fill:'none',stroke:'#d0d3a9','stroke-width':width+4,'stroke-linecap':'round'},features);
    svgNode('path',{d:path,fill:'none',stroke:'#4b8791','stroke-width':width,'stroke-linecap':'round'},features);
    svgNode('path',{d:path,fill:'none',stroke:'#a9c4b5','stroke-width':Math.max(1,width/4),'stroke-linecap':'round'},features);
    caption(name,x,y,'#285765',width>6?17:12);
  }
  const roadLayer = svgNode('g', {'aria-label':'도시 연결로와 회랑'}, terrain);
  for (const road of roads) {
    const points = road.map(point => {
      if (Array.isArray(point)) return point.map(value => value*sourceScale);
      const sourcePoint = roadJunctions[point] || gates[point];
      return sourcePoint ? sourcePoint.map(value => value*sourceScale) : cityLocations.get(point);
    }).map(([x,y]) => x + ',' + y).join(' ');
    const style = {points,fill:'none','stroke-linecap':'round','stroke-linejoin':'round'};
    svgNode('polyline',{...style,stroke:'#584532','stroke-width':5.3},roadLayer);
    svgNode('polyline',{...style,stroke:'#f7e0a8','stroke-width':2.9},roadLayer);
  }
  const featuresLayer = svgNode('g', {'aria-label':'회랑 분기점과 관문'}, terrain);
  for (const [x,y] of Object.values(roadJunctions)) {
    svgNode('circle',{cx:x*sourceScale,cy:y*sourceScale,r:2.7,fill:'#f7e0a8',stroke:'#584532','stroke-width':1},featuresLayer);
  }
  Object.values(gates).forEach(([x,y], index) => {
    const gate = svgNode('g',{transform:'translate('+x*sourceScale+' '+y*sourceScale+')'},featuresLayer);
    const label = svgNode('title',{},gate);
    label.textContent = '관문 ' + (index+1);
    svgNode('path',{d:'M-5 4V-4H-2V-2H2V-4H5V4H1.7V1a1.7 1.7 0 0 0-3.4 0v3Z',
      fill:'#fff0ca',stroke:'#403121','stroke-width':1.15,'stroke-linejoin':'round'},gate);
  });  const cityLayer = svgNode('g', {'aria-label':'도시 위치'}, terrain);
  for (const [x,y] of cityLocations.values()) {
    svgNode('circle',{cx:x,cy:y,r:3.5,fill:'#733d2a',stroke:'#fff4ce','stroke-width':1.2},cityLayer);
  }
}

function regionFrame(index) {
  if (!index) return [0,0,chartWidth,chartHeight];
  const points = cityPoints[index];
  const xs = points.map(([x]) => x), ys = points.map(([,y]) => y);
  const x0 = Math.min(...xs), x1 = Math.max(...xs);
  const y0 = Math.min(...ys), y1 = Math.max(...ys);
  const width = Math.max(380, x1-x0+108, (y1-y0+94)*16/9);
  const height = width*9/16;
  return [Math.max(0,Math.min(chartWidth-width,(x0+x1-width)/2)),
    Math.max(0,Math.min(chartHeight-height,(y0+y1-height)/2)),width,height];
}

function button(text, action) {
  const item = document.createElement('button');
  item.type = 'button';
  item.textContent = text;
  item.addEventListener('click', action);
  return item;
}

function setView(index, city = '', focusLabel = false) {
  const changedRegion = region !== index;
  region = index;
  selected = city;
  if (city) showLabels = true;
  renderMap();
  renderCities();
  if (changedRegion) setZoom(0);
  if (focusLabel) {
    const marker = labels.querySelector('[aria-pressed="true"]');
    marker?.focus({preventScroll: true});
    marker?.scrollIntoView({block: 'nearest', inline: 'nearest'});
  }
}

function renderMap() {
  const [name] = regions[region];
  const [left, top, width, height] = regionFrame(region);
  terrain.setAttribute('viewBox', [left, top, width, height].join(' '));
  title.textContent = region ? name + ' 지방 확대지도' : name;
  terrain.setAttribute('aria-label', title.textContent + ' 산맥과 하천');
  [...nav.children].forEach((item, index) => item.setAttribute('aria-pressed', index === region));
  toggle.setAttribute('aria-pressed', showLabels);
  mapHint.textContent = region
    ? '황금색 선은 연결로와 회랑, 작은 원은 분기점, 성벽 표시는 관문입니다. 도시 이름을 누르면 강조됩니다. 100%에서 −를 누르면 전체지도로 돌아갑니다.'
    : '황금색 선은 연결로와 회랑, 작은 원은 분기점, 성벽 표시는 관문입니다. 지방을 선택하거나 확대하면 도시 이름이 표시됩니다.';
  labels.hidden = !showLabels;
  const entries = [];
  if (!region && !zoomIndex) {
    for (const [name, x, y, group] of regions[0][1]) {
      if (typeof group === 'number') entries.push([name, x, y, group]);
    }
  }
  for (const city of cities) {
    if (region && city.region !== region) continue;
    if (!region && !zoomIndex) continue;
    const [x,y] = cityLocations.get(city.name);
    entries.push([city.name, 100*(x-left)/width, 100*(y-top)/height, city.province, city.region]);
  }
  labels.replaceChildren(...entries.map(([text, x, y, group, cityRegion]) => {
    let item;
    if (typeof group === 'number') {
      item = button(text, () => {
        setView(group);
        nav.children[group].focus();
      });
      item.className = 'label r';
    } else if (group) {
      item = button(text, () => setView(cityRegion, text, true));
      item.className = 'label c';
      item.setAttribute('aria-pressed', selected === text);
      item.title = group + ' · ' + text;
    } else {
      item = document.createElement('span');
      item.textContent = text;
      item.className = 'label p';
    }
    item.style.setProperty('--x', x + '%');
    item.style.setProperty('--y', (group && typeof group === 'string' ? 'calc(' + y + '% - .9em)' : y + '%'));
    return item;
  }));
}

function renderCities() {
  const query = search.value.trim().normalize();
  const matches = cities.filter(city => query ? city.name.includes(query) : !region || city.region === region);
  status.textContent = (query ? '전체 지방 검색' : regions[region][0]) + ' · ' + matches.length + '개 항목';
  list.replaceChildren(...matches.map(({name, province, region: index}) => {
    const row = document.createElement('li');
    const item = button(name, () => setView(index, name, true));
    item.setAttribute('aria-pressed', index === region && name === selected);
    const place = document.createElement('small');
    place.textContent = regions[index][0] + ' · ' + province;
    item.append(place);
    row.append(item);
    return row;
  }));
}

function setZoom(index, anchorX = viewport.clientWidth / 2, anchorY = viewport.clientHeight / 2) {
  const wasOverview = !region && zoomIndex === 0;
  zoomIndex = Math.min(zoomSteps.length - 1, Math.max(0, index));
  const oldWidth = map.offsetWidth;
  const oldHeight = map.offsetHeight;
  const x = (viewport.scrollLeft + anchorX) / oldWidth;
  const y = (viewport.scrollTop + anchorY) / oldHeight;
  const scale = zoomSteps[zoomIndex];

  map.style.setProperty('--map-width', scale * 100 + '%');
  viewport.scrollLeft = x * map.offsetWidth - anchorX;
  viewport.scrollTop = y * map.offsetHeight - anchorY;
  viewport.classList.toggle('zoomed', zoomIndex > 0);
  zoomLevel.value = scale * 100 + '%';
  zoomOut.disabled = !region && zoomIndex === 0;
  zoomReset.disabled = zoomIndex === 0;
  zoomIn.disabled = zoomIndex === zoomSteps.length - 1;
  if (!region && wasOverview !== (zoomIndex === 0)) renderMap();
}

function zoomMap(direction, x = viewport.clientWidth / 2, y = viewport.clientHeight / 2) {
  if (region && !zoomIndex && direction < 0) {
    setView(0);
    return;
  }
  setZoom(zoomIndex + direction, x, y);
}

zoomOut.addEventListener('click', () => zoomMap(-1));
zoomIn.addEventListener('click', () => zoomMap(1));
zoomReset.addEventListener('click', () => setZoom(0));

viewport.addEventListener('wheel', event => {
  if (!(event.ctrlKey || event.metaKey) || !event.deltaY) return;
  event.preventDefault();
  const bounds = viewport.getBoundingClientRect();
  zoomMap(-Math.sign(event.deltaY), event.clientX - bounds.left, event.clientY - bounds.top);
}, {passive: false});

viewport.addEventListener('pointerdown', event => {
  if (!zoomIndex || event.pointerType !== 'mouse' || event.button !== 0 || event.target.closest('button')) return;
  if (!map.contains(event.target)) return;
  drag = {id: event.pointerId, x: event.clientX, y: event.clientY, left: viewport.scrollLeft, top: viewport.scrollTop};
  viewport.setPointerCapture(event.pointerId);
  viewport.classList.add('dragging');
});
viewport.addEventListener('pointermove', event => {
  if (drag?.id !== event.pointerId) return;
  viewport.scrollLeft = drag.left + drag.x - event.clientX;
  viewport.scrollTop = drag.top + drag.y - event.clientY;
});
viewport.addEventListener('lostpointercapture', event => {
  if (drag?.id !== event.pointerId) return;
  drag = null;
  viewport.classList.remove('dragging');
});

regions.forEach(([name], index) => nav.append(button(name, () => setView(index))));
setZoom(0);
search.addEventListener('input', renderCities);
toggle.addEventListener('click', () => {
  showLabels = !showLabels;
  renderMap();
});
drawTerrain();
setView(0);
</script>
</html>
