<section id="red-cliffs-map" aria-label="새 천하 지도의 적벽 상세">
  <style>
    #red-cliffs-map { display: grid; gap: calc(var(--font-size-base) * .5); }
    #red-cliffs-map figure { margin: 0; position: relative; overflow: hidden; }
    #red-cliffs-map svg { display: block; width: 100%; }
    #red-cliffs-map .base-route { fill: none; stroke: var(--background); stroke-width: 2; opacity: .58; vector-effect: non-scaling-stroke; }
    #red-cliffs-map .route-edge { fill: none; stroke: var(--foreground); stroke-width: 4; opacity: .7; vector-effect: non-scaling-stroke; }
    #red-cliffs-map .approach { fill: none; stroke-width: 2.5; vector-effect: non-scaling-stroke; }
    #red-cliffs-map .wei { color: var(--viz-series-2, var(--blue)); }
    #red-cliffs-map .allies { color: var(--viz-series-3, var(--orange)); }
    #red-cliffs-map .caption { position: absolute; white-space: nowrap; transform: translate(-50%, -50%); padding: 1px 5px; border-radius: 4px; color: var(--foreground); background: var(--background); }
    #red-cliffs-map .candidate { font-weight: 500; box-shadow: inset 0 -2px currentColor; }
    #red-cliffs-map .candidate span { color: var(--foreground); }
    #red-cliffs-map .legend-mark { font-weight: 500; }
    #red-cliffs-map .region-label, #red-cliffs-map .site-label { display: none; }
    #red-cliffs-map [data-view="region"] .region-label,
    #red-cliffs-map [data-view="site"] .site-label { display: block; }
    #red-cliffs-map .place-button { position: absolute; transform: translate(-50%, -50%); }
    #red-cliffs-map .terrain-shape { fill: var(--muted); fill-opacity: .55; stroke: var(--muted-foreground); stroke-opacity: .78; stroke-width: 1; vector-effect: non-scaling-stroke; }
    #red-cliffs-map .site-line { fill: none; stroke: var(--foreground); stroke-width: 1; vector-effect: non-scaling-stroke; }
    #red-cliffs-map [data-view="site"] .base-route,
    #red-cliffs-map [data-view="site"] .route-edge { opacity: .35; }
  </style>
  <div class="viz-row" role="group" aria-label="지도 범위">
    <button type="button" class="btn" data-select="region" aria-pressed="false">형초 지도</button>
    <button type="button" class="btn" data-select="site" aria-pressed="true">적벽 상세</button>
  </div>

  <script>
    (() => {
      const root = document.getElementById("red-cliffs-map");
      const figure = root.querySelector("figure");
      const map = figure.querySelector("svg");
      const controls = root.querySelectorAll("[data-select]");
      const place = root.querySelector("[data-open-site]");
      const siteTab = root.querySelector('[data-select="site"]');
      const views = { region: "700 405 302 195", site: "780 438 150 125" };
      const select = (view) => {
        figure.dataset.view = view;
        map.setAttribute("viewBox", views[view]);
        controls.forEach((button) => button.setAttribute("aria-pressed", String(button.dataset.select === view)));
      };
      const openView = (view) => {
        select(view);
        window.openai?.setWidgetState?.({ modelContent: null, privateContent: { view } }).catch(() => {});
      };
      controls.forEach((button) => button.addEventListener("click", () => openView(button.dataset.select)));
      place.addEventListener("click", () => {
        openView("site");
        siteTab.focus();
      });
      const restore = (state) => {
        const view = state?.privateContent?.view;
        if (view === "region" || view === "site") select(view);
      };
      restore(window.openai?.widgetState);
      window.addEventListener("openai:set_globals", (event) => restore(event.detail?.globals?.widgetState));
    })();
  </script>
